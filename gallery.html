<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Nethub</title>
  <link rel="icon" href="assets/nethub/logo-mark-inverse.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/nethub/nethub.css">
</head>
<body class="nethub-site">
  <header class="nh-nav" id="nav">
    <div class="nh-wrap">
      <div class="nh-nav-top">
        <a class="nh-brand" href="index.html"><img src="assets/nethub/logo-nav.png" alt="Nethub"></a>
        <nav class="nh-nav-links"></nav>
        <a class="nh-btn nh-btn-primary nh-nav-cta" href="register.html">Join a lab</a>
        <button class="nh-menu-btn" type="button" aria-label="Menu" onclick="document.getElementById('nav').classList.toggle('open')">Menu</button>
      </div>
    </div>
  </header>
  <section class="nh-hero">
    <div class="nh-wrap">
      <div class="nh-kicker" data-cms-page="gallery" data-cms-field="kicker">Gallery</div>
      <h1 data-cms-page="gallery" data-cms-field="title">Labs, rooms, and people</h1>
      <p class="nh-lead" data-cms-page="gallery" data-cms-field="lead">Photos from campus, Sunday, and Community. The desk updates this wall.</p>
    </div>
  </section>
  <section class="nh-section">
    <div class="nh-wrap">
      <div class="nh-gallery" id="nh-gallery"></div>
    </div>
  </section>
  <section class="nh-section alt">
    <div class="nh-wrap">
      <h2>Online sessions</h2>
      <p class="intro">Live rooms the desk opens. Join when a link is posted.</p>
      <div class="nh-grid-3" id="nh-sessions"></div>
    </div>
  </section>
  <footer class="nh-footer"><div class="nh-wrap nh-copy">© 2026 Nethub. <a href="platform.html">Platform</a></div></footer>
  <script src="assets/nethub/nethub.js"></script>
</body>
</html>
