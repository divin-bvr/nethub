<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Nethub</title>
  <link rel="icon" href="assets/nethub/logo-mark-inverse.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/nethub/nethub.css">
</head>
<body class="nethub-site">
  <header class="nh-nav" id="nav">
    <div class="nh-wrap">
      <div class="nh-nav-top">
        <a class="nh-brand" href="index.html"><img src="assets/nethub/logo-nav.png" alt="Nethub"></a>
        <nav class="nh-nav-links">
          <a href="index.html">Home</a>
          <a href="register.html">Create a seat</a>
        </nav>
        <a class="nh-btn nh-btn-primary nh-nav-cta" href="register.html">No account yet</a>
        <button class="nh-menu-btn" type="button" aria-label="Menu" onclick="document.getElementById('nav').classList.toggle('open')">Menu</button>
      </div>
    </div>
  </header>

  <section class="nh-hero">
    <div class="nh-wrap nh-auth-wrap">
      <article class="nh-auth-card">
        <div class="nh-kicker">Returning learner</div>
        <h1>Sign in</h1>
        <p class="nh-lead">If you do not have an account, create a seat first. The desk still has to approve new profiles.</p>
        <form data-auth-form="/login">
          <label>Email or username<input name="email" required autocomplete="username"></label>
          <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
          <p class="nh-form-error" role="alert"></p>
          <button class="nh-btn nh-btn-primary" type="submit">Enter the lab</button>
        </form>
        <p class="nh-or">or</p>
        <div id="nh-oauth" class="nh-oauth"></div>
        <p class="nh-auth-switch">No account? <a href="register.html">Create one</a></p>
      </article>
    </div>
  </section>
  <script src="assets/nethub/nethub.js"></script>
  <script src="assets/nethub/auth.js"></script>
</body>
</html>
