<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create a lab seat | Nethub</title>
  <link rel="icon" href="assets/nethub/logo-mark-inverse.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/nethub/nethub.css">
</head>
<body class="nethub-site">
  <header class="nh-nav" id="nav">
    <div class="nh-wrap">
      <div class="nh-nav-top">
        <a class="nh-brand" href="index.html"><img src="assets/nethub/logo-nav.png" alt="Nethub"></a>
        <nav class="nh-nav-links">
          <a href="index.html#campuses">Campuses</a>
          <a href="catalog.html">Labs</a>
          <a href="login.html">Sign in</a>
        </nav>
        <a class="nh-btn nh-btn-primary nh-nav-cta" href="login.html">I already have a seat</a>
        <button class="nh-menu-btn" type="button" aria-label="Menu" onclick="document.getElementById('nav').classList.toggle('open')">Menu</button>
      </div>
    </div>
  </header>

  <section class="nh-hero">
    <div class="nh-wrap nh-auth-wrap">
      <article class="nh-auth-card">
        <div class="nh-kicker">New learner</div>
        <h1>Create a seat</h1>
        <p class="nh-lead">No account yet — start here. After you submit, the desk assesses the profile before a full approve.</p>
        <form data-auth-form="/register">
          <label>Full name<input name="name" required autocomplete="name"></label>
          <label>Email<input name="email" type="email" required autocomplete="email"></label>
          <label>University or community
            <div class="nh-combo" data-combo="university">
              <input type="search" id="university-search" placeholder="Search all universities…" autocomplete="off" aria-autocomplete="list">
              <input type="hidden" id="university-select" required>
              <ul class="nh-combo-list" id="university-list" hidden></ul>
            </div>
          </label>
          <label>Club at that place
            <select name="club_id" id="club-select" required>
              <option value="">Search a university first</option>
            </select>
          </label>
          <label>I am a
            <select name="role">
              <option value="student">Student</option>
              <option value="mentor">Mentor / facilitator</option>
            </select>
          </label>
          <label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
          <p class="nh-form-error" role="alert"></p>
          <button class="nh-btn nh-btn-primary" type="submit">Create account</button>
        </form>
        <p class="nh-or">or</p>
        <div id="nh-oauth" class="nh-oauth"></div>
        <p class="nh-auth-switch">Already enrolled? <a href="login.html">Sign in</a></p>
      </article>
    </div>
  </section>
  <script src="assets/nethub/nethub.js"></script>
  <script src="assets/nethub/auth.js"></script>
  <script src="assets/nethub/clubs.js"></script>
</body>
</html>
