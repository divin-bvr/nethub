<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalog | Nethub</title>
  <meta name="description" content="Eleven Nethub learning tracks. Enrol for a seat. The desk grants each module after payment.">
  <link rel="icon" href="assets/nethub/logo-mark-inverse.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/nethub/nethub.css">
</head>
<body class="nethub-site">
  <header class="nh-nav" id="nav">
    <div class="nh-wrap">
      <div class="nh-nav-top">
        <a class="nh-brand" href="index.html"><img src="assets/nethub/logo-nav.png" alt="Nethub"></a>
        <nav class="nh-nav-links"></nav>
        <a class="nh-btn nh-btn-primary nh-nav-cta" href="register.html">Join a lab</a>
        <button class="nh-menu-btn" type="button" aria-label="Menu" onclick="document.getElementById('nav').classList.toggle('open')">Menu</button>
      </div>
    </div>
  </header>

  <section class="nh-hero">
    <div class="nh-wrap">
      <div class="nh-kicker">Learning catalog</div>
      <h1>The eleven tracks we actually teach</h1>
      <p class="nh-lead nh-lead-narrow">Same subjects as About. Learn more, then enrol to pay. After payment an admin grants that module on your seat.</p>
    </div>
  </section>

  <section class="nh-section">
    <div class="nh-wrap">
      <div class="nh-grid-3" id="nh-catalog-grid"></div>
    </div>
  </section>

  <footer class="nh-footer"><div class="nh-wrap nh-copy">© 2026 Nethub. <a href="platform.html">Platform</a></div></footer>
  <script src="assets/nethub/modules.js"></script>
  <script src="assets/nethub/nethub.js"></script>
  <script>
    (function () {
      var grid = document.getElementById("nh-catalog-grid");
      if (!grid || !window.NETHUB_MODULES) return;
      grid.innerHTML = NETHUB_MODULES.map(function (m) {
        return (
          '<article class="nh-course nh-scroll-fade">' +
            '<div class="nh-course-photos"><img src="' + m.img + '" alt="' + m.title + '"></div>' +
            '<div class="nh-fan-tags"><span>' + m.tag.toUpperCase() + "</span></div>" +
            "<h3>" + m.title + "</h3>" +
            "<p>" + m.blurb + "</p>" +
            '<div class="nh-card-actions">' +
              '<a class="nh-btn nh-btn-ghost" href="module.html?id=' + m.slug + '">Learn more</a>' +
              '<a class="nh-btn nh-btn-primary" href="pricing.html?module=' + m.slug + '">Enrol</a>' +
            "</div>" +
          "</article>"
        );
      }).join("");
    })();
  </script>
</body>
</html>
