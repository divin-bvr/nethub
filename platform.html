<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platform | Nethub</title>
  <link rel="icon" href="assets/nethub/logo-mark-inverse.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/nethub/nethub.css">
</head>
<body class="nethub-site">
  <header class="nh-nav" id="nav">
    <div class="nh-wrap"><div class="nh-nav-top">
      <a class="nh-brand" href="index.html"><img src="assets/nethub/logo-nav.png" alt="Nethub"></a>
      <nav class="nh-nav-links"></nav>
      <a class="nh-btn nh-btn-ghost nh-nav-cta" href="register.html">Student seat</a>
      <button class="nh-menu-btn" type="button" onclick="document.getElementById('nav').classList.toggle('open')">Menu</button>
    </div></div>
  </header>
  <section class="nh-hero">
    <div class="nh-wrap nh-auth-wrap">
      <article class="nh-auth-card">
        <div class="nh-kicker">Platform</div>
        <h1>Desk sign-in</h1>
        <p class="nh-lead">Approve student seats after you have assessed the profile. Learners use Create a seat. Desk: username <strong>admin</strong>, email <strong>admin@nethub.club</strong> — change that password after first login.</p>
        <form data-auth-form="/login" data-require-admin="1">
          <label>Email or username<input name="email" required autocomplete="username"></label>
          <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
          <p class="nh-form-error" role="alert"></p>
          <button class="nh-btn nh-btn-primary" type="submit">Open the desk</button>
        </form>
      </article>
    </div>
  </section>
  <footer class="nh-footer"><div class="nh-wrap nh-copy">© 2026 Nethub.</div></footer>
  <script src="assets/nethub/nethub.js"></script>
  <script src="assets/nethub/auth.js"></script>
</body>
</html>
